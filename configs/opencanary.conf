{
    "device.node_id": "opencanary-1",
    "ip.ignorelist": [],
    "ftp.enabled": true,
    "ftp.port": 2121,
    "ftp.banner": "FTP server ready",
    "http.enabled": true,
    "http.port": 8080,
    "http.skin": "nasLogin",
    "ssh.enabled": true,
    "ssh.port": 2222,
    "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5",
    "smb.enabled": false,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/tmp/opencanary.log"
                }
            }
        }
    }
}
